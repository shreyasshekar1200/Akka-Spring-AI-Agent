<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>RAG Agent Workstation - Dark Mode</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.2/marked.min.js"></script>
        <style>
            /* Custom scrollbar for dark mode */
            ::-webkit-scrollbar {
                width: 8px;
            }
            ::-webkit-scrollbar-track {
                background: #1f2937;
            }
            ::-webkit-scrollbar-thumb {
                background: #4b5563;
                border-radius: 4px;
            }

            /* High-contrast code blocks */
            #chat-window pre {
                background-color: #111827 !important;
                border: 1px solid #374151;
                padding: 1rem;
                border-radius: 0.5rem;
                margin: 0.5rem 0;
                overflow-x: auto;
            }
            #chat-window code {
                color: #10b981; /* Emerald green for code text */
                font-family: "Fira Code", monospace;
            }
            .user-msg {
                background-color: #3b82f6;
                color: white;
                align-self: flex-end;
            }
            .ai-msg {
                background-color: #374151;
                color: #f3f4f6;
                align-self: flex-start;
            }
        </style>
    </head>
    <body
        class="bg-gray-900 text-gray-100 min-h-screen flex flex-col items-center p-4"
    >
        <header class="w-full max-w-4xl text-center mb-6">
            <h1
                class="text-3xl font-bold flex items-center justify-center gap-3"
            >
                🧠
                <span
                    class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400"
                    >RAG Agent Workstation</span
                >
            </h1>
        </header>

        <main
            class="w-full max-w-4xl bg-gray-800 border border-gray-700 rounded-xl shadow-2xl flex flex-col overflow-hidden h-[600px]"
        >
            <div
                id="chat-window"
                class="flex-1 overflow-y-auto p-6 flex flex-col gap-4"
            >
                <div class="ai-msg p-4 rounded-lg max-w-[80%] shadow-sm">
                    Hello! I am your updated AI assistant (Llama 3.1). I can now
                    handle tool calls and searches. How can I help?
                </div>
            </div>

            <div class="p-4 bg-gray-900 border-t border-gray-700 flex gap-2">
                <input
                    type="text"
                    id="user-input"
                    placeholder="Ask a question..."
                    class="flex-1 bg-gray-800 border border-gray-600 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                />
                <button
                    onclick="sendMessage()"
                    class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-2 rounded-lg font-semibold transition"
                >
                    Send
                </button>
            </div>
        </main>

        <section
            class="w-full max-w-4xl mt-6 p-6 bg-gray-800 rounded-xl border border-gray-700 border-dashed"
        >
            <h2 class="text-xl font-semibold mb-4 text-center">
                Knowledge Staging Area
            </h2>
            <div class="flex flex-col items-center gap-4">
                <button
                    class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded border border-gray-500 text-sm"
                >
                    + Select Files
                </button>
                <button
                    class="w-full bg-emerald-700 hover:bg-emerald-600 py-2 rounded-lg font-bold"
                >
                    Ingest Staged Files (0)
                </button>
            </div>
        </section>

        <footer class="w-full max-w-4xl mt-4">
            <button
                class="w-full bg-red-900/30 border border-red-700 text-red-400 py-2 rounded-lg hover:bg-red-900/50 transition text-sm italic"
            >
                🚀 START QLoRA TRAINING (Unloads Model)
            </button>
        </footer>

        <script>
            const chatWindow = document.getElementById("chat-window");
            const userInput = document.getElementById("user-input");

            function appendMessage(role, text) {
                const div = document.createElement("div");
                div.className = `${role}-msg p-4 rounded-lg max-w-[80%] shadow-sm`;
                // Use marked to render Markdown/Code blocks
                div.innerHTML = marked.parse(text);
                chatWindow.appendChild(div);
                chatWindow.scrollTop = chatWindow.scrollHeight;
            }

            async function sendMessage() {
                const query = userInput.value;
                if (!query) return;

                appendMessage("user", query);
                userInput.value = "";

                try {
                    // Adjust this endpoint to match your Akka/Spring controller
                    const response = await fetch(
                        `/api/ask?query=${encodeURIComponent(query)}`,
                    );
                    const data = await response.text();
                    appendMessage("ai", data);
                } catch (error) {
                    appendMessage(
                        "ai",
                        "Error: Could not connect to the service.",
                    );
                }
            }

            // Allow 'Enter' key to send
            userInput.addEventListener("keypress", (event) => {
                if (event.key === "Enter") sendMessage();
            });
        </script>
    </body>
</html>
